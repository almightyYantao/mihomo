# LB Connect 用的 mihomo 内核：测 iwan 出站，打 tag 时出桌面端二进制。
#
# 发版：git tag v1.19.30-lb.N && git push origin v1.19.30-lb.N
# 产物命名和上游 release 一致（mihomo-darwin-arm64-<tag>.gz 等），
# lb-clash 的 update_mihomo.sh 和应用内升级只换了仓库地址。
name: lbconnect

on:
  push:
    branches: [lbconnect]
    tags: ["v*-lb.*"]
  pull_request:
    branches: [lbconnect]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./transport/iwan/ ./adapter/outbound/
      - run: go test ./transport/iwan/ ./adapter/...
      - run: go build -tags with_gvisor ./...

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUILDTIME="$(date -u)"
          LDFLAGS="-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="mihomo-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags with_gvisor -trimpath -ldflags "$LDFLAGS" -o "$out" .
            if [ "$os" = windows ]; then
              zip -q "dist/mihomo-${os}-${arch}-${VERSION}.zip" "$out"
            else
              mv "$out" "mihomo-${os}-${arch}-${VERSION}"
              gzip -9 "mihomo-${os}-${arch}-${VERSION}"
              mv "mihomo-${os}-${arch}-${VERSION}.gz" dist/
            fi
          done
          (cd dist && sha256sum * > sha256sums.txt)
          ls -l dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "基于上游 mihomo，加了 iwan 出站（LB Connect 用）。"
